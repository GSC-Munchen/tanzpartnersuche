<html
    lang="de"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:f="http://typo3.org/ns/TYPO3/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true"
>
<!-- Templates/Delete.html -->
    <div class="extension_frame">
        <h1><f:translate key="LLL:EXT:tanzpartnersuche/Resources/Private/Language/de.tanzpartnersuche.xlf:deleteTitle" /></h1>

        <p><f:translate key="LLL:EXT:tanzpartnersuche/Resources/Private/Language/de.tanzpartnersuche.xlf:deleteIntro" /></p>

        <f:flashMessages />

        <f:form action="deleteconfirm" additionalAttributes="{role:'form', onsubmit: 'return confirm(\'Möchten Sie Ihren Account und alle Ihre Daten wirklich sofort und unwiderruflich löschen? Dieser Vorgang kann nicht rückgängig gemacht werden.\');'}">
        <label for="password">
            <f:translate key="LLL:EXT:tanzpartnersuche/Resources/Private/Language/de.tanzpartnersuche.xlf:db_password" />
        </label><br />
        <f:form.password name="password" id="password" required="TRUE" /><br />
        <f:form.submit class="tpsbutton lightred" value="Account löschen" />
        </f:form>

        <f:link.action action="loggedin" class="tpsbutton alignright"><f:translate key="LLL:EXT:tanzpartnersuche/Resources/Private/Language/de.tanzpartnersuche.xlf:btn_cancel" /></f:link.action>
    </div>

</html>
