<html
    lang="de"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:f="http://typo3.org/ns/TYPO3/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true"
>
<!-- Templates/Newpassword.html -->
    <div class="extension_frame">
        <h1><f:translate key="LLL:EXT:tanzpartnersuche/Resources/Private/Language/de.tanzpartnersuche.xlf:newpasswordTitle" /></h1>

        <p><f:translate key="LLL:EXT:tanzpartnersuche/Resources/Private/Language/de.tanzpartnersuche.xlf:newpasswordIntro" /></p>

        <f:flashMessages />

        <f:form action="updatepassword" additionalAttributes="{role:'form'}">
        <f:render partial="Tanzpartnersuche/NewpasswordFields" arguments="{email: email, token: token}" />
        <f:form.submit class="tpsbutton" value="Bestätigen" />
        </f:form>
    </div>

</html>
