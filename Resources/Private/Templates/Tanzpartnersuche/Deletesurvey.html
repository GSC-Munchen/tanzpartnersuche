<html
    lang="de"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:f="http://typo3.org/ns/TYPO3/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true"
>
<!-- Templates/Deletesurvey.html -->
    <div class="extension_frame">
        <h1><f:translate key="LLL:EXT:tanzpartnersuche/Resources/Private/Language/de.tanzpartnersuche.xlf:deleteSurveyTitle" /></h1>

        <p><f:translate key="LLL:EXT:tanzpartnersuche/Resources/Private/Language/de.tanzpartnersuche.xlf:deleteSurveyIntro" /></p>

        <f:form action="deletesurveysend">
            <p><f:translate key="LLL:EXT:tanzpartnersuche/Resources/Private/Language/de.tanzpartnersuche.xlf:deleteSurveyQuestion" /></p>

            <label>
                <f:form.radio name="reason" value="1" checked="TRUE" />
                <f:translate key="LLL:EXT:tanzpartnersuche/Resources/Private/Language/de.tanzpartnersuche.xlf:deleteSurveyReason1" />
            </label><br />
            <label>
                <f:form.radio name="reason" value="2" />
                <f:translate key="LLL:EXT:tanzpartnersuche/Resources/Private/Language/de.tanzpartnersuche.xlf:deleteSurveyReason2" />
            </label><br />
            <label>
                <f:form.radio name="reason" value="3" />
                <f:translate key="LLL:EXT:tanzpartnersuche/Resources/Private/Language/de.tanzpartnersuche.xlf:deleteSurveyReason3" />
            </label><br />
            <label>
                <f:form.radio name="reason" value="4" />
                <f:translate key="LLL:EXT:tanzpartnersuche/Resources/Private/Language/de.tanzpartnersuche.xlf:deleteSurveyReason4" />
            </label><br />
            <label>
                <f:form.radio name="reason" value="5" />
                <f:translate key="LLL:EXT:tanzpartnersuche/Resources/Private/Language/de.tanzpartnersuche.xlf:deleteSurveyReason5" />
            </label><br />
            <label>
                <f:form.radio name="reason" value="6" />
                <f:translate key="LLL:EXT:tanzpartnersuche/Resources/Private/Language/de.tanzpartnersuche.xlf:deleteSurveyReason6" />
            </label><br />

            <br />
            <label for="comment">
                <f:translate key="LLL:EXT:tanzpartnersuche/Resources/Private/Language/de.tanzpartnersuche.xlf:deleteSurveyCommentLabel" />
            </label><br />
            <f:form.textarea name="comment" id="comment" rows="5" cols="83" /><br />

            <f:form.submit class="tpsbutton" value="{f:translate(key: 'LLL:EXT:tanzpartnersuche/Resources/Private/Language/de.tanzpartnersuche.xlf:btn_send')}" />
        </f:form>

        <f:link.action action="main" class="tpsbutton alignright"><f:translate key="LLL:EXT:tanzpartnersuche/Resources/Private/Language/de.tanzpartnersuche.xlf:btn_skip" /></f:link.action>
    </div>

</html>
